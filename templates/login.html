<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | SkillBridge AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            Skill<span>Bridge</span> AI
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Continue your career journey.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="primary-btn auth-btn">

                Login

            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </p>

    </div>

</div>

</body>

</html>
